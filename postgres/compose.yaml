# Base de datos de desarrollo. Copiar a la raíz de cada proyecto junto con .env.example.
# Volúmenes con nombre (disco virtual de Docker), nunca carpetas de Windows montadas.
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # solo localhost: no expone la BD en Wi-Fi públicas o compartidas
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
